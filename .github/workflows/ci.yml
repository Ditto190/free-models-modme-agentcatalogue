name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Validate data consistency
        run: npm run validate:data
      - name: Validate i18n dictionaries
        run: npm run validate:i18n
      - name: Lint
        run: npm run lint
      - name: Build (SSG + route handlers)
        run: npm run build
      - name: Verify serialized endpoint shape
        run: npm run verify:endpoints
